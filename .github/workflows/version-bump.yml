name: Version bump on merge to main

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Check if version was already bumped
        id: version-check
        run: bunx tsx .github/scripts/check-version.ts

      - name: Apply patch bump (default)
        if: steps.version-check.outputs.changed == 'false'
        run: |
          npm version patch -m "chore: bump version to %s [skip ci]"

      - name: Push version commit and tag
        if: steps.version-check.outputs.changed == 'false'
        run: |
          git push
          git push --tags
